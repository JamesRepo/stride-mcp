spring.application.name=stride-mcp

# Phase 1 is a command-line tool: no web server, and a quiet console.
# Phase 3 (stdio MCP) also needs no web server. Phase 5 (hosted) will turn it back on.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN

# The MCP server is off, except in serve mode (application-serve.properties). It reads stdin, and so does login.
spring.ai.mcp.server.enabled=false
spring.ai.mcp.server.annotation-scanner.enabled=false

# Where the Garmin tokens are saved. Override with --stride.token-file=...
stride.token-file=${user.home}/.stride-mcp/garmin_tokens.json

# Where Garmin's replies are cached. Override with --stride.cache-dir=...
# stride-mcp creates this folder. An existing folder it didn't make is never used.
stride.cache-dir=${user.home}/.stride-mcp/cache
