# Serve mode: `java -jar stride-mcp.jar serve`. The AI app starts it and talks to it over stdin and stdout.

# The MCP server, over stdio. Spring AI's starter builds it. The transport is ours: see mcp/McpBeans.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.annotation-scanner.enabled=true
# Tools only: no prompts, resources or completions. The tools never change while it runs.
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.tool-change-notification=false
spring.ai.mcp.server.name=stride-mcp
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.instructions=Garmin data for the owner of this computer. \
Dates are in the owner's Garmin profile time zone. Units are metric. \
If a tool says to run `stride-mcp login`, tell the owner to run it in a terminal: this server can't log in by itself.

# stdout carries MCP messages only, so no console logging. Logs go to a file instead (warnings and errors),
# set up by logback-serve.xml and mcp/PrivateLogFile. Override with --stride.log-file=...
logging.config=classpath:logback-serve.xml
stride.log-file=${user.home}/.stride-mcp/stride-mcp.log
logging.file.name=${stride.log-file}
# Plus one line per tool call: the tool, how long it took, whether it worked.
logging.level.com.hammez.stride.mcp.GarminTools=INFO
# Spring AI's annotation scanner trips a harmless "not eligible for getting processed" warning on every start.
logging.level.[org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker]=ERROR
